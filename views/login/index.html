<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../src/output.css" rel="stylesheet">
    <title>Login</title>
</head>
<body class="bg-zinc-500">
    <nav id="navbar" class="fixed top-0 right-0 left-0 bg-slate-900 h-16">
    </nav>
    <div class="pt-16 h-screen flex max-w-7xl mx-auto justify-center items-center px-4">
        <div class="hidden lg:flex w-2/4 justify-center items-center">
            <img class="w-3/4 " src="/images/signup.svg" alt="Imagen para Registro">
        </div>
        <form id="form" class="flex flex-col gap-4 bg-zinc-200 p-4 rounded-lg text-md shadow-lg w-full md:w-9/12 lg:w-2/4">

            <div class="flex flex-col gap-2">
                <label for="email-input" class="font-bold text-zinc-900">Correo <span class="text-red-500">*</span></label>
                <input type="email" id="email-input" name="email-input" autocomplete="off" class="rounded-lg p-2 bg-zinc-100 focus:outline-indigo-700">

            </div>

            
            <div class="flex flex-col gap-2">
                <label for="password-input" class="font-bold text-zinc-900">Contraseña <span class="text-red-500">*</span></label>
                <input type="password" id="password-input" name="password-input" autocomplete="off" class="rounded-lg p-2 bg-zinc-100 focus:outline-indigo-700">
                <p id="error-text" class="text-sm text-red-800"></p>
            </div>

            <button id="form-btn" class="bg-indigo-700 py-2 px-4 rounded-lg font-bold text-white transition ease-in-out hover:bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed">Iniciar Sesion</button>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../components/nav.js"></script>
    <script src="index.js"></script>
</body>
</html>
